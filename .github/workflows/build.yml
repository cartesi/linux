name: Build

on: [push]

permissions:
  contents: read

jobs:
  build:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    container: debian:trixie-20250811
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            autoconf \
            automake \
            bc \
            bison \
            build-essential \
            ca-certificates \
            flex \
            gcc-riscv64-linux-gnu \
            git \
            libarchive-dev \
            libc6-dev-riscv64-cross \
            python3 \
            rsync \
            wget \
            xz-utils

      - name: Install xgenext2fs
        run: |
          wget -q https://github.com/cartesi/genext2fs/archive/refs/tags/v1.5.6.tar.gz
          echo "34bfc26a037def23b85b676912462a3d126a87ef15c66c212b3500650da44f9e  v1.5.6.tar.gz" | sha256sum -c -
          tar -xzf v1.5.6.tar.gz
          cd genext2fs-1.5.6
          ./autogen.sh
          ./configure
          make
          make install
          cd ..
          rm -rf genext2fs-1.5.6 v1.5.6.tar.gz

      - name: Checkout Linux source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build artifacts
        run: |
          make -f cartesi.mk
          cd artifacts
          for f in *; do
            sha512sum "$f" > "$f.sha512"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts
          path: artifacts/*
          compression-level: 0

  release:
    name: Publish artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts

      - name: Publish release artifacts
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: true
          files: |
            linux-*
